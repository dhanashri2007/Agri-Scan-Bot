<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Background Circle/Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Robot Track / Gear accents -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#047857" stroke-width="6" stroke-dasharray="16 12" />
  
  <!-- 4WD Wheel Accents -->
  <rect x="70" y="110" width="36" height="70" rx="10" fill="#10b981" opacity="0.8" />
  <rect x="406" y="110" width="36" height="70" rx="10" fill="#10b981" opacity="0.8" />
  <rect x="70" y="332" width="36" height="70" rx="10" fill="#10b981" opacity="0.8" />
  <rect x="406" y="332" width="36" height="70" rx="10" fill="#10b981" opacity="0.8" />

  <!-- Robot Chassis Frame -->
  <rect x="120" y="120" width="272" height="272" rx="36" fill="#065f46" stroke="#10b981" stroke-width="4" />

  <!-- Stylized Plant Leaf -->
  <path d="M 256 160 C 180 160 170 260 256 340 C 342 260 332 160 256 160 Z" fill="url(#leafGrad)" />
  <path d="M 256 175 L 256 335" stroke="#022c22" stroke-width="4" stroke-linecap="round" />
  <path d="M 256 220 Q 220 230 200 250" stroke="#022c22" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 256 250 Q 290 260 310 280" stroke="#022c22" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Optical Camera Aperture / Crosshair -->
  <circle cx="256" cy="256" r="88" fill="none" stroke="#6ee7b7" stroke-width="3" stroke-dasharray="6 6" />
  <line x1="256" y1="150" x2="256" y2="170" stroke="#38bdf8" stroke-width="4" />
  <line x1="256" y1="340" x2="256" y2="360" stroke="#38bdf8" stroke-width="4" />
  <line x1="150" y1="256" x2="170" y2="256" stroke="#38bdf8" stroke-width="4" />
  <line x1="340" y1="256" x2="360" y2="256" stroke="#38bdf8" stroke-width="4" />

  <!-- Laser Scan Beam Horizontal Line -->
  <rect x="140" y="250" width="232" height="12" fill="url(#scanGrad)" />
  <circle cx="256" cy="256" r="8" fill="#38bdf8" />
</svg>
